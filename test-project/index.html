<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant Form W 本地测试项目</title>
  <link rel="stylesheet" href="node_modules/ant-design-vue/dist/reset.css">
  <link rel="stylesheet" href="../dist/style.css">
  <style>
    body {
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    .test-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .test-header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    
    .test-header h1 {
      margin: 0 0 10px 0;
      font-size: 2.5rem;
    }
    
    .test-header p {
      margin: 0;
      opacity: 0.9;
      font-size: 1.1rem;
    }
    
    .test-content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    
    .test-section {
      margin-bottom: 40px;
      padding: 20px;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
    }
    
    .test-section h2 {
      margin: 0 0 20px 0;
      color: #1890ff;
      font-size: 1.5rem;
      border-bottom: 2px solid #1890ff;
      padding-bottom: 8px;
    }
    
    .result-area {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #1890ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      .test-container {
        padding: 10px;
      }
      
      .test-content {
        padding: 20px;
      }
      
      .test-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="test-container">
      <div class="test-header">
        <h1>🧪 Ant Form W</h1>
        <p>基于 Vue3 + Ant Design Vue 的自定义表单组件库 - 本地测试</p>
      </div>
      
      <div class="test-content">
        <div v-if="loading" class="loading">
          <div class="spinner"></div>
        </div>
        
        <div v-else>
          <!-- 基础表单测试 -->
          <div class="test-section">
            <h2>📝 基础表单测试</h2>
            <CustomForm
              :model="basicForm.model"
              :rules="basicForm.rules"
              layout="horizontal"
              @finish="handleBasicSubmit"
              @finish-failed="handleBasicFailed"
              @values-change="handleValuesChange"
              ref="basicFormRef"
            >
              <FormItem name="name" label="姓名" :rules="[{ required: true, message: '请输入姓名' }]">
                <Input v-model:value="basicForm.model.name" placeholder="请输入姓名" />
              </FormItem>

              <FormItem name="email" label="邮箱" :rules="emailRules">
                <Input v-model:value="basicForm.model.email" placeholder="请输入邮箱地址" />
              </FormItem>

              <FormItem name="age" label="年龄" :rules="ageRules">
                <InputNumber v-model:value="basicForm.model.age" :min="1" :max="120" style="width: 100%" placeholder="请输入年龄" />
              </FormItem>

              <template #actions-left>
                <Button @click="handleReset">🔄 重置表单</Button>
              </template>
            </CustomForm>
          </div>

          <!-- 垂直布局测试 -->
          <div class="test-section">
            <h2>📋 垂直布局测试</h2>
            <CustomForm
              :model="verticalForm.model"
              :rules="verticalForm.rules"
              layout="vertical"
              submit-text="垂直提交测试"
              @finish="handleVerticalSubmit"
              :loading="verticalForm.loading"
            >
              <FormItem name="username" label="用户名" :rules="[{ required: true, message: '请输入用户名' }]">
                <Input v-model:value="verticalForm.model.username" placeholder="请输入用户名" />
              </FormItem>

              <FormItem name="password" label="密码" :rules="[{ required: true, message: '请输入密码' }]">
                <Input.Password v-model:value="verticalForm.model.password" placeholder="请输入密码" />
              </FormItem>
            </CustomForm>
          </div>

          <!-- 复杂表单测试 -->
          <div class="test-section">
            <h2>🎯 复杂表单测试</h2>
            <CustomForm
              :model="complexForm.model"
              :rules="complexForm.rules"
              layout="horizontal"
              @finish="handleComplexSubmit"
              ref="complexFormRef"
            >
              <FormItem name="firstName" label="名字" :rules="[{ required: true, message: '请输入名字' }]">
                <Input v-model:value="complexForm.model.firstName" placeholder="请输入名字" />
              </FormItem>

              <FormItem name="gender" label="性别" :rules="[{ required: true, message: '请选择性别' }]">
                <RadioGroup v-model:value="complexForm.model.gender">
                  <Radio value="male">👨 男</Radio>
                  <Radio value="female">👩 女</Radio>
                </RadioGroup>
              </FormItem>

              <FormItem name="birthDate" label="出生日期">
                <DatePicker v-model:value="complexForm.model.birthDate" style="width: 100%" placeholder="请选择出生日期" />
              </FormItem>

              <template #actions-right>
                <Button @click="validateFirstName">✅ 验证名字</Button>
                <Button @click="showFormData">📊 查看数据</Button>
              </template>
            </CustomForm>
          </div>

          <!-- 测试结果 -->
          <div class="test-section" v-if="testResults.length > 0">
            <h2>📈 测试结果 ({{ testResults.length }})</h2>
            <div class="result-area">
              <div v-for="(result, index) in testResults" :key="index" style="margin-bottom: 15px; padding: 10px; background: white; border-radius: 4px;">
                <strong>{{ result.test }}</strong> - {{ new Date(result.timestamp).toLocaleString() }}
                <pre style="margin: 8px 0 0 0; color: #666;">{{ JSON.stringify(result.data, null, 2) }}</pre>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Vue 3 -->
  <script src="node_modules/vue/dist/vue.global.js"></script>
  <!-- Ant Design Vue -->
  <script src="node_modules/ant-design-vue/dist/antd.min.js"></script>
  <!-- Ant Form W Package -->
  <script src="../dist/index.umd.js"></script>
  
  <script>
    const { createApp, ref, reactive, onMounted } = Vue;
    const { Button, Input, Form, InputNumber, Radio, RadioGroup, DatePicker, message } = antd;
    
    const app = createApp({
      setup() {
        const loading = ref(true);
        const basicFormRef = ref();
        const complexFormRef = ref();
        const testResults = ref([]);
        
        // 基础表单
        const basicForm = reactive({
          model: {
            name: '',
            email: '',
            age: undefined
          },
          rules: {}
        });
        
        const emailRules = [
          { required: true, message: '请输入邮箱地址', trigger: 'blur' },
          { type: 'email', message: '请输入有效的邮箱地址', trigger: 'blur' }
        ];
        
        const ageRules = [
          { required: true, message: '请输入年龄', trigger: 'blur' },
          { type: 'number', min: 1, max: 120, message: '年龄必须在1-120之间', trigger: 'blur' }
        ];
        
        // 垂直表单
        const verticalForm = reactive({
          loading: false,
          model: {
            username: '',
            password: ''
          },
          rules: {}
        });
        
        // 复杂表单
        const complexForm = reactive({
          model: {
            firstName: '',
            gender: undefined,
            birthDate: null
          },
          rules: {}
        });
        
        // 事件处理
        const handleBasicSubmit = (values) => {
          console.log('✅ 基础表单提交:', values);
          testResults.value.unshift({
            test: '基础表单提交',
            timestamp: new Date().toISOString(),
            data: values
          });
          message.success('🎉 基础表单提交成功！');
        };
        
        const handleBasicFailed = (errorInfo) => {
          console.log('❌ 基础表单验证失败:', errorInfo);
          message.error('😞 请检查表单填写是否正确');
        };
        
        const handleVerticalSubmit = async (values) => {
          console.log('✅ 垂直表单提交:', values);
          verticalForm.loading = true;
          
          // 模拟异步提交
          await new Promise(resolve => setTimeout(resolve, 1500));
          
          testResults.value.unshift({
            test: '垂直表单提交',
            timestamp: new Date().toISOString(),
            data: values
          });
          
          verticalForm.loading = false;
          message.success('🎉 垂直表单提交成功！');
        };
        
        const handleComplexSubmit = (values) => {
          console.log('✅ 复杂表单提交:', values);
          testResults.value.unshift({
            test: '复杂表单提交',
            timestamp: new Date().toISOString(),
            data: values
          });
          message.success('🎉 复杂表单提交成功！');
        };
        
        const handleValuesChange = (changedValues, allValues) => {
          console.log('🔄 表单值变化:', { changedValues, allValues });
        };
        
        const handleReset = () => {
          basicForm.model = { name: '', email: '', age: undefined };
          message.info('🔄 表单已重置');
        };
        
        const validateFirstName = async () => {
          const result = await complexFormRef.value?.validateField('firstName');
          console.log('🔍 单字段验证结果:', result);
          message.info('✅ 已验证姓名字段');
        };
        
        const showFormData = () => {
          const data = complexFormRef.value?.getValues();
          console.log('📊 当前表单数据:', data);
          message.info('📊 请查看控制台输出的表单数据');
        };
        
        onMounted(() => {
          setTimeout(() => {
            loading.value = false;
            console.log('🚀 Ant Form W 测试项目加载完成！');
          }, 1000);
        });
        
        return {
          loading,
          basicForm,
          verticalForm,
          complexForm,
          basicFormRef,
          complexFormRef,
          testResults,
          emailRules,
          ageRules,
          handleBasicSubmit,
          handleBasicFailed,
          handleVerticalSubmit,
          handleComplexSubmit,
          handleValuesChange,
          handleReset,
          validateFirstName,
          showFormData
        };
      }
    });
    
    // 注册组件
    app.component('CustomForm', AntFormW.CustomForm);
    app.component('FormItem', AntFormW.FormItem || Form.Item);
    
    // 使用Ant Design Vue
    app.use(antd);
    app.mount('#app');
  </script>
</body>
</html>
