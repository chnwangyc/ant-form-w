<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant Form W 测试</title>
  <link rel="stylesheet" href="node_modules/ant-design-vue/dist/reset.css">
  <style>
    body {
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      max-width: 600px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <!-- 引入Vue -->
  <script src="node_modules/vue/dist/vue.global.js"></script>
  <!-- 引入ant-design-vue -->
  <script src="node_modules/ant-design-vue/dist/antd.min.js"></script>
  <!-- 引入我们的包 -->
  <script src="../dist/index.umd.js"></script>
  
  <script>
    const { createApp } = Vue;
    const { Button, Input, Form } = antd;
    
    // 使用我们的组件
    const app = createApp({
      setup() {
        const formData = Vue.reactive({
          username: '',
          email: ''
        });
        
        const handleFinish = (values) => {
          console.log('表单提交成功:', values);
          alert('提交成功: ' + JSON.stringify(values));
        };
        
        const handleFinishFailed = (errorInfo) => {
          console.log('表单验证失败:', errorInfo);
        };
        
        return {
          formData,
          handleFinish,
          handleFinishFailed
        };
      },
      template: `
        <h1>Ant Form W 测试</h1>
        <CustomForm
          :model="formData"
          layout="vertical"
          @finish="handleFinish"
          @finish-failed="handleFinishFailed"
          submit-text="保存数据"
          :loading="false"
        >
          <FormItem
            label="用户名"
            name="username"
            :rules="[{ required: true, message: '请输入用户名' }]"
          >
            <Input v-model:value="formData.username" placeholder="请输入用户名" />
          </FormItem>

          <FormItem
            label="邮箱"
            name="email"
            :rules="[{ type: 'email', message: '请输入正确的邮箱格式' }]"
          >
            <Input v-model:value="formData.email" placeholder="请输入邮箱" />
          </FormItem>
        </CustomForm>
      `
    });
    
    // 使用我们的组件库
    app.use(AntFormW);
    app.mount('#app');
  </script>
</body>
</html>
